<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Status Pesanan</title>
  <link href="https://fonts.googleapis.com/css2?family=Baumans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="spesanan.css">

</head>

<body>
  <div class="app">
    <aside>
      <h1>Status pesanan</h1>
      <nav id="tabs"></nav>
    </aside>
    <main>
      <div class="top">
        <label class="search"><svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg><input id="q" placeholder="Cek pesanan mu..." autocomplete="off"></label>
        <div class="fwrap"><button class="fbtn" id="fb"><svg viewBox="0 0 24 24">
              <path d="M3 5h18l-7 8v6l-4-2v-4z" />
            </svg><span>Filter</span></button>
          <div class="pop" id="pop"><button data-s="def" class="on">Default</button><button data-s="az">Nama
              A–Z</button><button data-s="za">Nama Z–A</button></div>
        </div>
      </div>
      <h2 id="ttl">All</h2>
      <div id="list"></div>
    </main>
  </div>
  <div id="toast"></div>
  <script src="spesanan.js"></script>
</body>

</html>
